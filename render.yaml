services:
    - type: web
      name: typeracer-api
      runtime: node
      region: singapore
      plan: 0.5c-512mb
      numInstances: 1
      buildCommand: npm ci && npm run build
      startCommand: npm start
      healthCheckPath: /health
      maxShutdownDelaySeconds: 30
      envVars:
          - key: NODE_VERSION
            value: 24.14.1
          - key: ALLOWED_ORIGINS
            value: https://typing-combat.vercel.app
          - key: DATABASE_URL
            sync: false
          - key: ROOM_TOKEN_SECRET
            sync: false
